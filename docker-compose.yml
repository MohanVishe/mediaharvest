# MediaHarvest. Start:  docker compose up -d     then open http://localhost:8081
#
# `up` pulls the published image. To build it from this folder's source
# instead:  docker compose up -d --build
#
# Safe defaults on purpose:
# - The port is published on 127.0.0.1, this computer only. MediaHarvest has
#   no login, so on 0.0.0.0 anyone on the same Wi-Fi could use it and read
#   your downloads. For other devices, put a reverse proxy with a login in
#   front (README, "Use it from your phone").
# - Per-download yt-dlp options stay off: they can run commands.
# - Settings live in .env (copy .env.example).
services:
  mediaharvest:
    image: ghcr.io/mohanvishe/mediaharvest:${MEDIAHARVEST_TAG:-latest}
    build: .
    container_name: mediaharvest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEDIAHARVEST_PORT:-8081}:8081"
    volumes:
      - "${MEDIAHARVEST_DOWNLOADS:-./downloads}:/downloads"
    environment:
      PUID: ${MEDIAHARVEST_UID:-1000}
      PGID: ${MEDIAHARVEST_GID:-1000}
      ALLOW_YTDL_OPTIONS_OVERRIDES: "false"
      DEFAULT_THEME: "auto"
