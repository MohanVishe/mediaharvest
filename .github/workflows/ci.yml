name: ci

# Tests every push and pull request. Pushes to main (and v* tags) then build
# the multi-arch image and publish it to GitHub Container Registry as
# ghcr.io/<owner>/mediaharvest. No secrets needed: GITHUB_TOKEN is enough.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm
        run: npm install -g corepack && corepack enable
      - name: Frontend install
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        working-directory: ui
        run: pnpm run lint
      - name: Frontend tests
        working-directory: ui
        run: pnpm exec ng test --watch=false
        env:
          CI: true
      - name: Frontend build
        working-directory: ui
        run: pnpm run build
      - uses: astral-sh/setup-uv@v7
      - name: Backend install
        run: uv sync --frozen --group dev
      - name: Backend tests
        run: uv run pytest app/tests/
      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release for v* tags
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mediaharvest"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${image}:${version},${image}:latest"
          else
            version="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
            tags="${image}:latest,${image}:${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=MediaHarvest
            org.opencontainers.image.description=Download videos and music in the format and quality you choose
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
