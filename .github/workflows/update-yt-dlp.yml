name: update-yt-dlp

# yt-dlp breaks whenever YouTube changes, so its fixes matter. Once a day this
# bumps yt-dlp in uv.lock when a new release is out, pushes the commit, and
# starts ci, which tests it and publishes a fresh image. A push made with
# GITHUB_TOKEN does not start other workflows by itself, hence the explicit run.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Bump yt-dlp
        id: bump
        run: |
          before=$(grep -A1 '^name = "yt-dlp"$' uv.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          uv lock --upgrade-package yt-dlp
          after=$(grep -A1 '^name = "yt-dlp"$' uv.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
      - name: Commit and start ci
        if: steps.bump.outputs.before != steps.bump.outputs.after
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.bump.outputs.before }}
          AFTER: ${{ steps.bump.outputs.after }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update yt-dlp from $BEFORE to $AFTER"
          git push
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
